[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terramow-ha"
version = "0.1.0"
description = "Home Assistant integration for TerraMow robotic lawn mowers"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "homeassistant>=2024.1.0",
    "paho-mqtt>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
]

[tool.ruff.isort]
known-first-party = ["custom_components.terramow"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Incremental typing: only the modules listed here are gated in CI. Untyped
# modules they import are resolved but not reported (follow_imports = silent),
# so the checked surface can grow one module at a time. Add a module here once
# it is fully typed.
follow_imports = "silent"
files = [
    "custom_components/terramow/binary_sensor.py",
    "custom_components/terramow/button.py",
    "custom_components/terramow/config_flow.py",
    "custom_components/terramow/const.py",
    "custom_components/terramow/diagnostics.py",
    "custom_components/terramow/entity.py",
    "custom_components/terramow/entity_utils.py",
    "custom_components/terramow/issues.py",
    "custom_components/terramow/lawn_mower.py",
    "custom_components/terramow/map_sensor.py",
    "custom_components/terramow/number.py",
    "custom_components/terramow/select.py",
    "custom_components/terramow/sensor.py",
    "custom_components/terramow/switch.py",
    "custom_components/terramow/update.py",
]

[[tool.mypy.overrides]]
module = [
    "paho.mqtt.*",
]
ignore_missing_imports = true

[tool.black]
target-version = ["py312"]
line-length = 88
[tool.coverage.run]
source = ["custom_components/terramow"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]
