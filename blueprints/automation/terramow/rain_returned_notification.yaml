blueprint:
  name: TerraMow – Returned because of rain
  description: >
    Send a notification when the TerraMow returns to its base station
    because rain was detected (the rain binary sensor turns on).
  domain: automation
  source_url: https://github.com/it-rec/TerraMowHA/blob/main/blueprints/automation/terramow/rain_returned_notification.yaml
  input:
    rain_sensor:
      name: Rain detected sensor
      description: The TerraMow "Rain detected" binary sensor.
      selector:
        entity:
          filter:
            - integration: terramow
              domain: binary_sensor
    notify_action:
      name: Notification action
      description: The action to run — e.g. a mobile app notification.
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input rain_sensor
    to: "on"

action:
  - choose: []
    default: !input notify_action
