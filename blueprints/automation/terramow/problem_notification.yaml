blueprint:
  name: TerraMow – Problem notification
  description: >
    Send a notification when the TerraMow reports a problem (the problem
    binary sensor turns on). Useful to catch a stuck mower, a lifted robot
    or any fault that needs attention.
  domain: automation
  source_url: https://github.com/it-rec/TerraMowHA/blob/main/blueprints/automation/terramow/problem_notification.yaml
  input:
    problem_sensor:
      name: Problem sensor
      description: The TerraMow "Problem" binary sensor.
      selector:
        entity:
          filter:
            - integration: terramow
              domain: binary_sensor
    notify_action:
      name: Notification action
      description: The action to run — e.g. a mobile app notification.
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input problem_sensor
    to: "on"

action:
  - choose: []
    default: !input notify_action
