---
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+"
    # A merged "chore: bump version" PR releases on its own: the run tags the
    # merge commit with the new manifest version and publishes from it.
    # Manifest edits that keep the version (e.g. requirements) are skipped
    # because the tag already exists.
    branches:
      - main
    paths:
      - custom_components/terramow/manifest.json
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

# Serialize runs so a bump-triggered run and a manually pushed tag for the
# same version cannot both publish; the later one sees the release and skips.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SKIP=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            MANIFEST_VERSION=$(python -c               "import json,sys; print(json.load(open(sys.argv[1]))['version'])"               custom_components/terramow/manifest.json)
            TAG="v${MANIFEST_VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "${TAG} already exists; manifest change is not a version bump"
              SKIP=true
            else
              # Pushed with GITHUB_TOKEN, so it does not re-trigger this
              # workflow via the tag filter.
              git tag "${TAG}" "${GITHUB_SHA}"
              git push origin "refs/tags/${TAG}"
            fi
          fi
          if [ "${SKIP}" = "false" ] && gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do"
            SKIP=true
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        if: steps.meta.outputs.skip != 'true'
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          MANIFEST_PATH=custom_components/terramow/manifest.json
          MANIFEST_VERSION=$(python -c \
            "import json,sys; print(json.load(open(sys.argv[1]))['version'])" \
            "$MANIFEST_PATH")
          echo "manifest version: ${MANIFEST_VERSION}"
          echo "tag version:      ${TAG_VERSION}"
          if [ "${MANIFEST_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::manifest.json version (${MANIFEST_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

      - name: Create HACS-compatible zip
        if: steps.meta.outputs.skip != 'true'
        run: |
          cd custom_components/terramow
          zip -r "${{ github.workspace }}/terramow.zip" .

      # GitHub's auto-generated notes only list merged PULL REQUESTS between
      # the tags; commits pushed directly to main produce an empty body. Build
      # the notes from the commit messages instead (subject as heading, body
      # as detail), and keep generate_release_notes for the compare link.
      # The generated notes are appended below this body under their own
      # "## What's Changed" heading, so this section uses a different one --
      # naming both the same rendered as a duplicate heading up to v1.62.0.
      - name: Build release notes from commits
        if: steps.meta.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            END="${TAG}"
          else
            END="HEAD"
          fi
          PREV=$(git tag --merged "${END}" --sort=-v:refname \
            | grep -vx "${TAG}" | head -n 1 || true)
          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${END}"
          else
            RANGE="${END}"
          fi
          {
            echo "## Details"
            echo
            git log --no-merges --reverse \
              --pretty=format:'### %s%n%n%b%n' "${RANGE}" \
              | sed -E '/^Co-Authored-By:/d; /^Claude-Session:/d'
            echo
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            terramow.zip
