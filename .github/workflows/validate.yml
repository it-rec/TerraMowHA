---
name: Validate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # This fork does not carry the store-listing repository metadata
          # (description, topics, enabled Issues) that HACS requires for the
          # public default store. Skip those repo-only checks so validation of
          # the integration itself (manifest, hacs.json, brands) still runs.
          ignore: topics description issues

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # Fails the job if total coverage drops below the floor, so the test
      # suite can't silently regress. Raise the floor as coverage grows.
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=custom_components/terramow \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=68

      - name: Add coverage summary
        if: always()
        run: |
          pip install coverage
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-empty >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          # Public repo: works without a token. Don't fail the build if the
          # upload itself has a hiccup — the local gate above is the guard.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall custom_components/terramow

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff
        continue-on-error: true
        run: ruff check custom_components/terramow

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt mypy

      # Type-checks the fully-typed modules declared in pyproject's
      # [tool.mypy] files list. The list grows as more modules are typed.
      - name: Run mypy
        run: mypy
