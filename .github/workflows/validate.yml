---
name: Validate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the trailing comment) so a
# moved tag or branch cannot change what runs; Dependabot bumps the pins.
# hacs/action has no current release tag, so it is pinned to a main commit
# and bumped by hand.

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # 2026.11.0

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (2026-06-08)
        with:
          category: integration
          # This fork does not carry the store-listing repository metadata
          # (description, topics, enabled Issues) that HACS requires for the
          # public default store. Skip those repo-only checks so validation of
          # the integration itself (manifest, hacs.json, brands) still runs.
          ignore: topics description issues

  tests-matrix:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Home Assistant release hacs.json declares as supported.
          # pytest-homeassistant-custom-component pins Home Assistant, so the
          # plugin version selects the HA version.
          - name: HA 2025.3 minimum / Python 3.13
            python: "3.13"
            plugin: "==0.13.225"
            # The plugin release for HA 2025.3 resolves an aiohttp that this
            # HA release does not support; pin the one it was built with.
            extra: "aiohttp==3.11.13"
            report: false
          # The newest Home Assistant release: the plugin is left unpinned and
          # needs the Python version current HA requires.
          - name: HA latest / Python 3.14
            python: "3.14"
            plugin: ""
            extra: ""
            report: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        env:
          PLUGIN: pytest-homeassistant-custom-component${{ matrix.plugin }}
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt "${PLUGIN}" ${EXTRA:+"${EXTRA}"}
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      # Fails the job if coverage drops below 100 % (line and branch) on any
      # supported Home Assistant version.
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=custom_components/terramow \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Add coverage summary
        if: always()
        run: |
          pip install coverage
          echo "## Test coverage (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-empty >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always() && matrix.report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          flags: unittests
          # Public repo: works without a token. Don't fail the build if the
          # upload itself has a hiccup — the local gate above is the guard.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always() && matrix.report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  # Single status for the main ruleset, which requires a check named "Tests";
  # it passes only when every matrix leg passed.
  tests:
    name: Tests
    if: always()
    needs: tests-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.tests-matrix.result }}
        run: |
          echo "tests-matrix: ${RESULT}"
          test "${RESULT}" = "success"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall custom_components/terramow

      - name: Install ruff
        # Pinned so a future ruff release can't add rules or change formatting
        # under the blocking gates; bump deliberately.
        run: python -m pip install --upgrade pip "ruff==0.15.20"

      - name: Run ruff
        run: ruff check custom_components tests

      - name: Check formatting
        run: ruff format --check custom_components tests

      - name: Check frontend card loads as an ES module
        # HA loads the card as an ES module; a strict/module-goal error would
        # silently leave the custom element undefined in the browser.
        run: node tests/frontend/eval_card_module.mjs

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt mypy

      # Strict type check of the whole package (pyproject's [tool.mypy]).
      - name: Run mypy
        run: mypy
