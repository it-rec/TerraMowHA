---
name: Validate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # This fork does not carry the store-listing repository metadata
          # (description, topics, enabled Issues) that HACS requires for the
          # public default store. Skip those repo-only checks so validation of
          # the integration itself (manifest, hacs.json, brands) still runs.
          ignore: topics description issues

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall custom_components/terramow

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff
        continue-on-error: true
        run: ruff check custom_components/terramow
